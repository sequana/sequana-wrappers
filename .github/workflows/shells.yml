name: Tests shells

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "sequana_wrappers/shells/**"
  pull_request:
    branches-ignore: []
    paths:
      - "sequana_wrappers/shells/**"
  workflow_dispatch:
  schedule:
    # Monthly full run on the 4th — same cadence as wrapper tests
    - cron: "0 0 4 * *"


jobs:
  # ------------------------------------------------------------------ #
  # Job 1: detect which shells need testing                             #
  # ------------------------------------------------------------------ #
  detect:
    runs-on: ubuntu-latest
    outputs:
      shells: ${{ steps.find.outputs.shells }}
      any: ${{ steps.find.outputs.any }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch for diff
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main

      - name: Find shells to test
        id: find
        run: |
          SHELLS_ROOT="sequana_wrappers/shells"

          # Expand a given <tool>/<command> into one matrix entry per
          # Snakefile found under its test/ directory. Supports both
          # layouts:
          #   test/Snakefile           (legacy, single version)
          #   test/<version>/Snakefile (per-version layout, e.g. test/v1)
          expand_shell() {
            local shell="$1"
            local testdir="${SHELLS_ROOT}/${shell}/test"
            [ -d "${testdir}" ] || return 0
            find "${testdir}" -mindepth 1 -maxdepth 2 -name Snakefile \
              | sed "s|${SHELLS_ROOT}/||;s|/Snakefile$||"
          }

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Full run: every shell that has a test/ directory
            SHELLS=$(find ${SHELLS_ROOT} -mindepth 3 -maxdepth 3 -type d -name test \
              | sed "s|${SHELLS_ROOT}/||;s|/test$||" \
              | sort -u)
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Push to main: shells changed in the last commit
            SHELLS=$(git diff HEAD^ --name-only 2>/dev/null \
              | grep "^${SHELLS_ROOT}/" \
              | awk -F/ 'NF>=5{print $3"/"$4}' \
              | sort -u)
          else
            # PR: shells changed relative to main
            SHELLS=$(git diff origin/main --name-only \
              | grep "^${SHELLS_ROOT}/" \
              | awk -F/ 'NF>=5{print $3"/"$4}' \
              | sort -u)
          fi

          # Exclude shells whose container download is too slow for CI,
          # then expand each shell into one entry per Snakefile found.
          EXCLUDED="medaka"
          TESTABLE=""
          for shell in $SHELLS; do
            tool=$(echo "$shell" | cut -d/ -f1)
            if echo "$EXCLUDED" | grep -qw "$tool"; then
              echo "Skipping excluded shell: $shell"
              continue
            fi
            for entry in $(expand_shell "$shell"); do
              TESTABLE="${TESTABLE} ${entry}"
            done
          done

          if [ -z "$TESTABLE" ]; then
            echo "any=false" >> $GITHUB_OUTPUT
            echo "shells=[]" >> $GITHUB_OUTPUT
          else
            JSON=$(echo $TESTABLE | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
            echo "any=true" >> $GITHUB_OUTPUT
            echo "shells=${JSON}" >> $GITHUB_OUTPUT
          fi

          echo "Shells to test: $TESTABLE"


  # ------------------------------------------------------------------ #
  # Job 2: run each shell test in parallel                              #
  # ------------------------------------------------------------------ #
  test:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shell: ${{ fromJson(needs.detect.outputs.shells) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          curl -fsSL https://github.com/apptainer/apptainer/releases/download/v1.3.6/apptainer_1.3.6_amd64.deb \
            -o /tmp/apptainer.deb
          sudo dpkg -i /tmp/apptainer.deb
          apptainer --version

      - name: Install sequana_wrappers
        run: pip install -e .

      - name: Install snakemake
        run: pip install snakemake

      # Cache containers keyed on the test Snakefile content.
      # If the container URL changes (new Snakefile), the key changes
      # and the image is re-downloaded automatically.
      - name: Cache Apptainer images
        uses: actions/cache@v4
        with:
          path: apptainer_cache
          key: apptainer-${{ matrix.shell }}-${{ hashFiles(format('sequana_wrappers/shells/{0}/Snakefile', matrix.shell)) }}

      - name: Run shell test
        env:
          APPTAINER_CACHEDIR: ${{ github.workspace }}/apptainer_cache
        run: |
          TESTDIR="sequana_wrappers/shells/${{ matrix.shell }}"
          cd ${TESTDIR}
          # Bind the parent dir so per-version layouts (test/v1, test/v2)
          # can reach shared fixtures under test/data/. Harmless for the
          # legacy test/Snakefile layout.
          PARENT=$(realpath ..)
          snakemake -s Snakefile -c4 --use-singularity \
            --singularity-prefix ${{ github.workspace }}/apptainer_cache \
            --singularity-args "-B ${PARENT}" \
            --forceall

      - name: Sanitize shell name for artifact
        if: failure()
        id: artifact
        run: echo "name=logs-$(echo '${{ matrix.shell }}' | tr '/' '-')-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: sequana_wrappers/shells/${{ matrix.shell }}/**/*.log
          if-no-files-found: ignore
